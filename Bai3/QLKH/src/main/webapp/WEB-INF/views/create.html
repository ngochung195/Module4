<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <header th:replace="~{layout :: header}"></header>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Add New Customer</h2>
                <a th:href="@{/customers}" class="btn btn-secondary">Back to List</a>
            </div>

            <form th:action="@{/customers/save}" th:object="${customer}" method="post" novalidate="novalidate">
                <input type="hidden" th:field="*{id}"/>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Enter customer name" required />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Enter customer email" required />
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" placeholder="Enter customer address" required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Customer</button>
                    <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
