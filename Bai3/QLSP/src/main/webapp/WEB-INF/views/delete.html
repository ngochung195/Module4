<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận xoá sản phẩm</title>
    <style>
        :root {
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #fee2e2;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #991b1b;
        }

        .warning-text {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .product-summary {
            background-color: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .summary-item {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .summary-item:last-child {
            margin-bottom: 0;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Xác Nhận Xoá Sản Phẩm</h1>
        <p class="warning-text">Bạn có chắc chắn muốn xoá sản phẩm này không? Hành động này không thể hoàn tác.</p>

        <div class="product-summary">
            <div class="summary-item"><strong>Mã sản phẩm:</strong> <span th:text="${product.id}"></span></div>
            <div class="summary-item"><strong>Tên sản phẩm:</strong> <span th:text="${product.name}"></span></div>
            <div class="summary-item"><strong>Giá:</strong> <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')} + ' $'"></span></div>
            <div class="summary-item"><strong>Nhà sản xuất:</strong> <span th:text="${product.manufacturer}"></span></div>
        </div>

        <form th:action="@{/products/delete}" method="post">
            <input type="hidden" name="id" th:value="${product.id}" />
            <div class="actions">
                <a th:href="@{/products}" class="btn btn-secondary">Huỷ bỏ</a>
                <button type="submit" class="btn btn-danger">Xác nhận xoá</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
