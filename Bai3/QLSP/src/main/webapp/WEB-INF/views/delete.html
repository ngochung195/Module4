<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Xác nhận xóa khách hàng')}">
</head>
<body>
    <header th:replace="~{layout :: header}"></header>

    <div class="container" style="max-width: 600px;">
        <div class="card">
            <div class="page-header">
                <h2>Xác nhận xóa khách hàng</h2>
                <a th:href="@{/customers}" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
            </div>

            <p style="color: var(--danger); font-weight: 500; margin-bottom: 1rem;">
                Bạn có chắc chắn muốn xóa khách hàng sau đây không?
            </p>

            <div class="details-grid">
                <div class="details-label">ID:</div>
                <div th:text="${customer.id}">1</div>

                <div class="details-label">Họ và tên:</div>
                <div th:text="${customer.name}">John Doe</div>

                <div class="details-label">Email:</div>
                <div th:text="${customer.email}">john@codegym.vn</div>

                <div class="details-label">Địa chỉ:</div>
                <div th:text="${customer.address}">Hanoi</div>
            </div>

            <form th:action="@{/customers/delete}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                    <button type="submit" class="btn btn-danger">Xác nhận xóa</button>
                    <a th:href="@{/customers}" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
