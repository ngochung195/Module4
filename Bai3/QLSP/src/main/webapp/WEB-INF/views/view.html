<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .detail-row {
            display: flex;
            padding: 0.875rem 0;
            border-bottom: 1px solid var(--border);
        }

        .detail-row:last-of-type {
            border-bottom: none;
        }

        .detail-label {
            width: 140px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .detail-value {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .price-highlight {
            font-weight: 700;
            color: #059669;
            font-size: 1.1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #e0e7ff;
            color: #4338ca;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Chi Tiết Sản Phẩm</h1>

        <div class="detail-row">
            <div class="detail-label">Mã sản phẩm:</div>
            <div class="detail-value" th:text="${product.id}">1</div>
        </div>

        <div class="detail-row">
            <div class="detail-label">Tên sản phẩm:</div>
            <div class="detail-value"><strong th:text="${product.name}">Tên sản phẩm</strong></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">Giá bán:</div>
            <div class="detail-value price-highlight" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')} + ' $'">0.00 $</div>
        </div>

        <div class="detail-row">
            <div class="detail-label">Nhà sản xuất:</div>
            <div class="detail-value">
                <span class="badge" th:text="${product.manufacturer}">Hãng</span>
            </div>
        </div>

        <div class="detail-row">
            <div class="detail-label">Mô tả:</div>
            <div class="detail-value" th:text="${product.description != null and !product.description.isEmpty() ? product.description : 'Không có mô tả'}">Mô tả</div>
        </div>

        <div class="actions">
            <a th:href="@{/products}" class="btn btn-secondary">Quay lại danh sách</a>
            <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-primary">Chỉnh sửa</a>
        </div>
    </div>
</div>
</body>
</html>
