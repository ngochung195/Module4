<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-form {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            max-width: 450px;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-sm {
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 0.375rem;
        }

        .btn-edit {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        .btn-edit:hover {
            background-color: #c7d2fe;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete:hover {
            background-color: #fecaca;
        }

        .btn-view {
            background-color: #f1f5f9;
            color: #334155;
        }

        .btn-view:hover {
            background-color: #e2e8f0;
        }

        .alert {
            padding: 0.875rem 1.25rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 0.875rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #e2e8f0;
            color: #475569;
        }

        .price {
            font-weight: 600;
            color: #059669;
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Quản Lý Sản Phẩm</h1>
        <a th:href="@{/products/create}" class="btn btn-primary">+ Thêm sản phẩm mới</a>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Thanh tìm kiếm -->
    <div class="actions-bar">
        <form th:action="@{/products}" method="get" class="search-form">
            <input type="text" name="search" th:value="${searchKeyword}" placeholder="Tìm theo tên sản phẩm...">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a th:if="${searchKeyword != null and !searchKeyword.isEmpty()}" th:href="@{/products}" class="btn btn-secondary">Đặt lại</a>
        </form>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="card">
        <table th:if="${products != null and !products.isEmpty()}">
            <thead>
            <tr>
                <th style="width: 60px;">ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá ($)</th>
                <th>Mô tả</th>
                <th>Nhà sản xuất</th>
                <th style="text-align: center; width: 220px;">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td>
                    <strong th:text="${product.name}">Tên sản phẩm</strong>
                </td>
                <td class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')} + ' $'">0.00 $</td>
                <td th:text="${product.description}" style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Mô tả</td>
                <td>
                    <span class="badge" th:text="${product.manufacturer}">Hãng</span>
                </td>
                <td>
                    <div class="action-group" style="justify-content: center;">
                        <a th:href="@{/products/{id}/view(id=${product.id})}" class="btn btn-sm btn-view">Xem</a>
                        <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-edit">Sửa</a>
                        <a th:href="@{/products/{id}/delete(id=${product.id})}" class="btn btn-sm btn-delete">Xoá</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${products == null or products.isEmpty()}" class="empty-state">
            <p>Không có sản phẩm nào được tìm thấy.</p>
        </div>
    </div>
</div>
</body>
</html>
