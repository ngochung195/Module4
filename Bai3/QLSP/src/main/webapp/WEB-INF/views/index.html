<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Danh sách khách hàng')}">
</head>
<body>
    <header th:replace="~{layout :: header}"></header>

    <div class="container">
        <div class="card">
            <div class="page-header">
                <h2>Quản lý khách hàng</h2>
                <a th:href="@{/customers/create}" class="btn btn-primary">+ Thêm khách hàng mới</a>
            </div>

            <div th:if="${success}" class="alert-success" th:text="${success}"></div>

            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên khách hàng</th>
                        <th>Email</th>
                        <th>Địa chỉ</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer, rowStat : ${customers}">
                        <td th:text="${rowStat.count}">1</td>
                        <td th:text="${customer.name}">John Doe</td>
                        <td th:text="${customer.email}">john@codegym.vn</td>
                        <td th:text="${customer.address}">Hanoi</td>
                        <td style="text-align: right;">
                            <div class="actions" style="justify-content: flex-end;">
                                <a th:href="@{/customers/{id}/view(id=${customer.id})}" class="btn btn-sm btn-view">Xem</a>
                                <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-sm btn-edit">Sửa</a>
                                <a th:href="@{/customers/{id}/delete(id=${customer.id})}" class="btn btn-sm btn-del">Xóa</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">Chưa có khách hàng nào trong hệ thống.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
