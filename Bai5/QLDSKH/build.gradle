plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-parameters"
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Web MVC 6
    implementation 'org.springframework:spring-webmvc:6.2.6'

    // Hibernate Core 6.x
    implementation 'org.hibernate.orm:hibernate-core:6.6.10.Final'

    // MySQL Connector Java
    implementation 'mysql:mysql-connector-java:8.0.30'

    // Thymeleaf 3.1 for Spring 6
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.2.RELEASE'

    // Jakarta Servlet API 6.0 (Tomcat 10.1+)
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

war {
    archiveFileName = 'customer-management.war'
}
