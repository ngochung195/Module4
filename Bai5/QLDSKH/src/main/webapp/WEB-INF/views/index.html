<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Danh sách khách hàng')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container">
    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <h3 class="fw-bold text-secondary mb-0">Danh sách khách hàng</h3>
        </div>
        <div class="col-md-6 text-end">
            <a th:href="@{/customers/create}" class="btn btn-primary">
                <i class="fa-solid fa-plus me-1"></i> Thêm khách hàng mới
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Địa chỉ</th>
                            <th class="text-center" style="width: 220px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="customer : ${customers}">
                            <td class="ps-4 fw-semibold" th:text="${customer.id}">1</td>
                            <td th:text="${customer.name}">Nguyễn Văn A</td>
                            <td th:text="${customer.email}">a.nguyen@example.com</td>
                            <td th:text="${customer.address}">Hà Nội</td>
                            <td class="text-center">
                                <a th:href="@{/customers/{id}/view(id=${customer.id})}" class="btn btn-sm btn-outline-info btn-action" title="Xem chi tiết">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                                <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-sm btn-outline-warning btn-action" title="Chỉnh sửa">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <a th:href="@{/customers/{id}/delete(id=${customer.id})}" class="btn btn-sm btn-outline-danger btn-action" title="Xóa"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này không?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                Chưa có khách hàng nào trong hệ thống.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
