<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Chi tiết khách hàng')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h4 class="mb-0 fw-bold text-info-emphasis">Chi tiết khách hàng</h4>
                    <a th:href="@{/customers}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <div class="mb-3">
                    <label class="text-muted small text-uppercase fw-bold">Mã định danh (ID)</label>
                    <p class="fs-5 fw-semibold text-dark mb-0" th:text="${customer.id}">1</p>
                </div>

                <div class="mb-3">
                    <label class="text-muted small text-uppercase fw-bold">Họ và tên</label>
                    <p class="fs-5 fw-semibold text-dark mb-0" th:text="${customer.name}">Nguyễn Văn A</p>
                </div>

                <div class="mb-3">
                    <label class="text-muted small text-uppercase fw-bold">Email</label>
                    <p class="fs-5 text-dark mb-0" th:text="${customer.email}">a.nguyen@example.com</p>
                </div>

                <div class="mb-4">
                    <label class="text-muted small text-uppercase fw-bold">Địa chỉ</label>
                    <p class="fs-5 text-dark mb-0" th:text="${customer.address != null and !customer.address.isEmpty() ? customer.address : 'Chưa cập nhật'}">Hà Nội</p>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-warning">
                        <i class="fa-solid fa-pen-to-square me-1"></i> Sửa
                    </a>
                    <a th:href="@{/customers/{id}/delete(id=${customer.id})}" class="btn btn-danger"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này không?');">
                        <i class="fa-solid fa-trash me-1"></i> Xóa
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
