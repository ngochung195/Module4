<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head('Thêm mới khách hàng')}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0 fw-bold text-primary">Thêm mới khách hàng</h4>
                    <a th:href="@{/customers}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Nhập tên khách hàng" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@domain.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label fw-semibold">Địa chỉ</label>
                        <textarea class="form-control" id="address" rows="3" th:field="*{address}" placeholder="Nhập địa chỉ khách hàng"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a th:href="@{/customers}" class="btn btn-secondary me-md-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thông tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
