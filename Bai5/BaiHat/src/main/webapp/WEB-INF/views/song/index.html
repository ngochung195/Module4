<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Bài Hát - Music Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
        }
        .table-dark-custom {
            background-color: #1e293b;
            color: #cbd5e1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .table-dark-custom th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            border-color: #334155;
            padding: 14px 16px;
        }
        .table-dark-custom td {
            border-color: #334155;
            padding: 14px 16px;
            vertical-align: middle;
        }
        .genre-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        audio {
            width: 270px;
            height: 38px;
            filter: invert(0.85) hue-rotate(180deg);
        }
        .btn-custom-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 8px;
        }
        .btn-custom-primary:hover {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-info fs-4" th:href="@{/songs}">
            <i class="fa-solid fa-compact-disc fa-spin text-info me-2"></i>Music Player
        </a>
        <div class="d-flex">
            <a th:href="@{/songs/create}" class="btn btn-custom-primary">
                <i class="fa-solid fa-plus me-1"></i> Thêm Bài Hát Mới
            </a>
        </div>
    </div>
</nav>

<!-- Main Container -->
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-white mb-1"><i class="fa-solid fa-music text-info me-2"></i> Danh Sách Bài Hát</h2>
            <p class="text-secondary mb-0">Thưởng thức và quản lý thư viện âm nhạc của bạn</p>
        </div>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show bg-dark text-success border-success" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-dark text-danger border-danger" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Bảng danh sách bài hát -->
    <div class="table-responsive">
        <table class="table table-dark-custom">
            <thead>
            <tr>
                <th scope="col" style="width: 5%;">#</th>
                <th scope="col" style="width: 25%;">Tên Bài Hát</th>
                <th scope="col" style="width: 20%;">Nghệ Sĩ</th>
                <th scope="col" style="width: 15%;">Thể Loại</th>
                <th scope="col" style="width: 23%;">Trình Phát Nhạc</th>
                <th scope="col" style="width: 12%;" class="text-center">Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(songs)}">
                <td colspan="6" class="text-center py-5 text-secondary">
                    <i class="fa-solid fa-music fa-3x mb-3 d-block text-muted"></i>
                    Chưa có bài hát nào trong danh sách. Hãy thêm bài hát đầu tiên!
                </td>
            </tr>
            <tr th:each="song, iterStat : ${songs}">
                <td th:text="${song.id}">1</td>
                <td class="fw-semibold text-white">
                    <i class="fa-solid fa-music text-info me-2"></i>
                    <span th:text="${song.name}">Tên bài hát</span>
                </td>
                <td th:text="${song.artist}">Nghệ sĩ</td>
                <td>
                    <span class="genre-badge" th:text="${song.genre}">Pop</span>
                </td>
                <td>
                    <div th:if="${song.filePath != null and !#strings.isEmpty(song.filePath)}">
                        <audio controls>
                            <source th:src="@{'/audio/' + ${song.filePath}}" type="audio/mpeg">
                            <source th:src="@{'/audio/' + ${song.filePath}}" type="audio/ogg">
                            <source th:src="@{'/audio/' + ${song.filePath}}" type="audio/wav">
                            Trình duyệt không hỗ trợ thẻ audio HTML5.
                        </audio>
                    </div>
                    <span th:if="${song.filePath == null or #strings.isEmpty(song.filePath)}" class="text-secondary small fst-italic">
                        <i class="fa-solid fa-volume-xmark me-1"></i>Chưa có file nhạc
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{'/songs/' + ${song.id} + '/edit'}" class="btn btn-sm btn-outline-warning me-1" title="Chỉnh sửa">
                        <i class="fa-solid fa-pen-to-square"></i> Sửa
                    </a>
                    <a th:href="@{'/songs/' + ${song.id} + '/delete'}" class="btn btn-sm btn-outline-danger" title="Xóa">
                        <i class="fa-solid fa-trash"></i> Xóa
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
