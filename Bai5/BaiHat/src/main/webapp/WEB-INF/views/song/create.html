<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Bài Hát Mới - Music Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
        }
        .form-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .form-label {
            font-weight: 500;
            color: #94a3b8;
        }
        .btn-custom-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 8px;
        }
        .btn-custom-primary:hover {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-info fs-4" th:href="@{/songs}">
            <i class="fa-solid fa-compact-disc me-2"></i>Music Player
        </a>
        <a th:href="@{/songs}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-card">
                <h3 class="fw-bold text-white mb-4">
                    <i class="fa-solid fa-cloud-arrow-up text-info me-2"></i>Thêm Mới Bài Hát
                </h3>

                <form th:action="@{/songs/create}" th:object="${songForm}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label">Tên bài hát <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Nhập tên bài hát..." required>
                    </div>

                    <div class="mb-3">
                        <label for="artist" class="form-label">Nghệ sĩ biểu diễn <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="artist" th:field="*{artist}" placeholder="Nhập tên nghệ sĩ / ca sĩ..." required>
                    </div>

                    <div class="mb-3">
                        <label for="genre" class="form-label">Thể loại nhạc <span class="text-danger">*</span></label>
                        <select class="form-select" id="genre" th:field="*{genre}" required>
                            <option value="" disabled selected>-- Chọn thể loại nhạc --</option>
                            <option value="Nhạc Trẻ">Nhạc Trẻ / Pop</option>
                            <option value="Ballad">Ballad</option>
                            <option value="Rock">Rock</option>
                            <option value="EDM / Electronic">EDM / Dance</option>
                            <option value="R&B / Soul">R&B / Soul</option>
                            <option value="Jazz">Jazz</option>
                            <option value="Acoustic">Acoustic</option>
                            <option value="Nhạc Trịnh / Trữ Tình">Nhạc Trịnh / Trữ Tình</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="audioFile" class="form-label">Tệp âm thanh (.mp3, .wav, .ogg - Tối đa 25MB)</label>
                        <input class="form-control" type="file" id="audioFile" th:field="*{audioFile}" accept=".mp3,.wav,.ogg,audio/*">
                        <div class="form-text text-secondary">Chọn tệp âm thanh hợp lệ để tải lên server.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/songs}" class="btn btn-secondary px-4">Hủy</a>
                        <button type="submit" class="btn btn-custom-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Bài Hát
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
