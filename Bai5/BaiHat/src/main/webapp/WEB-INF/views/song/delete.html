<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Xóa Bài Hát - Music Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
        }
        .delete-card {
            background-color: #1e293b;
            border: 1px solid #ef4444;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.15);
            padding: 30px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-info fs-4" th:href="@{/songs}">
            <i class="fa-solid fa-compact-disc me-2"></i>Music Player
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="delete-card text-center">
                <i class="fa-solid fa-triangle-exclamation text-danger fa-4x mb-3"></i>
                <h3 class="fw-bold text-white mb-3">Xác Nhận Xóa Bài Hát</h3>
                <p class="text-secondary mb-4">Bạn có chắc chắn muốn xóa bài hát này khỏi danh sách không? File âm thanh trên đĩa cứng cũng sẽ được dọn dẹp.</p>

                <div class="bg-dark p-3 rounded-3 text-start mb-4 border border-secondary">
                    <p class="mb-2"><strong class="text-white">ID:</strong> <span class="text-info" th:text="${song.id}"></span></p>
                    <p class="mb-2"><strong class="text-white">Tên bài hát:</strong> <span class="text-white fw-bold" th:text="${song.name}"></span></p>
                    <p class="mb-2"><strong class="text-white">Nghệ sĩ:</strong> <span class="text-light" th:text="${song.artist}"></span></p>
                    <p class="mb-2"><strong class="text-white">Thể loại:</strong> <span class="text-light" th:text="${song.genre}"></span></p>
                    <p class="mb-0"><strong class="text-white">Tệp tin:</strong> <span class="text-muted" th:text="${song.filePath != null and !#strings.isEmpty(song.filePath) ? song.filePath : 'Không có'}"></span></p>
                </div>

                <form th:action="@{'/songs/' + ${song.id} + '/delete'}" method="post">
                    <input type="hidden" name="id" th:value="${song.id}" />
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/songs}" class="btn btn-secondary px-4">Hủy Bỏ</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fa-solid fa-trash me-1"></i> Xác Nhận Xóa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
