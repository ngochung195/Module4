<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - CodeGym Flower Shop">CodeGym Flower Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e84393;
            --primary-dark: #d63076;
            --accent-green: #2ecc71;
            --accent-orange: #f39c12;
            --bg-soft: #fdf8fa;
        }
        body {
            background-color: var(--bg-soft);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 800;
            color: var(--primary-color) !important;
            letter-spacing: -0.5px;
        }
        .cart-badge-btn {
            background: linear-gradient(135deg, #e84393, #fd79a8);
            color: #fff !important;
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(232, 67, 147, 0.25);
            transition: all 0.2s ease;
        }
        .cart-badge-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(232, 67, 147, 0.35);
            color: #fff !important;
        }
        .product-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(232, 67, 147, 0.14);
        }
        .product-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 260px;
            background-color: #f8f9fa;
        }
        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-img-wrapper img {
            transform: scale(1.06);
        }
        .sale-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff4757;
            color: #fff;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }
        .code-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(45, 52, 54, 0.75);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .product-title {
            font-size: 1.08rem;
            font-weight: 700;
            color: #2d3436;
            text-decoration: none;
            display: block;
            margin-bottom: 0.4rem;
            transition: color 0.2s;
        }
        .product-title:hover {
            color: var(--primary-color);
        }
        .price-current {
            color: #d63031;
            font-weight: 800;
            font-size: 1.2rem;
        }
        .price-old {
            color: #95a5a6;
            text-decoration: line-through;
            font-size: 0.92rem;
            margin-left: 8px;
        }
        .btn-buy-now {
            background-color: #f39c12;
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .btn-buy-now:hover {
            background-color: #e67e22;
            color: #fff;
        }
        .btn-add-cart {
            background-color: var(--primary-color);
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .btn-add-cart:hover {
            background-color: var(--primary-dark);
            color: #fff;
        }
        .promo-box {
            border: 1.5px dashed #2ecc71;
            background-color: #f0fff4;
            border-radius: 12px;
            padding: 1.15rem;
        }
        .qty-control-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }
        footer {
            margin-top: auto;
            background: #fff;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fs-4" th:href="@{/shop}">
            <i class="fa-solid fa-seedling me-2"></i>Hoa Tươi CodeGym
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/shop}">
                        <i class="fa-solid fa-store me-1 text-danger"></i>Danh sách sản phẩm
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/shopping-cart}">
                        <i class="fa-solid fa-cart-shopping me-1 text-primary"></i>Giỏ hàng của bạn
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <a th:href="@{/shopping-cart}" class="btn cart-badge-btn">
                    <i class="fa-solid fa-bag-shopping me-2"></i>
                    <span>Giỏ hàng</span>
                    <span class="badge bg-white text-danger rounded-pill ms-2"
                          th:text="${cart != null ? cart.countProductQuantity() : 0}">0</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div layout:fragment="content"></div>
</main>

<footer class="py-4 text-center text-muted small">
    <div class="container">
        <span>&copy; 2026 <strong>Hoa Tươi CodeGym</strong> - Ứng dụng Thương mại Điện tử Spring MVC &amp; Thymeleaf</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
