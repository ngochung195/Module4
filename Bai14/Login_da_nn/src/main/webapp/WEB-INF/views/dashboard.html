<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title th:text="#{dashboard.title}">Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .lang-switch {
            margin-bottom: 20px;
        }

        .lang-switch a {
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>

<body>

    <!-- Thanh chuyển đổi ngôn ngữ -->
    <div class="lang-switch">
        <span>Language: </span>
        <a th:href="@{/doLogin(lang='en')}">English</a> |
        <a th:href="@{/doLogin(lang='vi')}">Tiếng Việt</a> |
        <a th:href="@{/doLogin(lang='haw')}">Hawaiian</a>
    </div>

    <h2 th:text="#{dashboard.heading}">Dashboard</h2>

    <h3>
        <span th:text="#{dashboard.greeting}">Hello</span>,
        <span th:text="${user.username}">User</span>!
    </h3>

</body>

</html>
