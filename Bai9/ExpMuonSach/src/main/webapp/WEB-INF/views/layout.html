<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Thư Viện Sách'">Quản Lý Thư Viện</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease-in-out;
        }
        .card-custom:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }
        .badge-visitor {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            padding: 0.45rem 0.85rem;
            border-radius: 20px;
        }
        .code-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #1e3a8a;
            background: #eff6ff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: inline-block;
            border: 2px dashed #3b82f6;
        }
        footer {
            margin-top: auto;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1.5rem 0;
            color: #64748b;
        }
    </style>
</head>
<body>

<header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/books}">
                <i class="bi bi-book-half fs-4"></i>
                <span>Thư Viện Sách Online</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-nav-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/books}">
                            <i class="bi bi-collection me-1"></i> Danh Sách Sách
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books/return}">
                            <i class="bi bi-arrow-return-left me-1"></i> Trả Sách
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="badge-visitor me-2">
                        <i class="bi bi-people-fill me-1"></i> Lượt ghé thăm (AOP Log):
                        <strong class="text-warning" th:text="${visitorCount}">0</strong>
                    </span>
                    <a th:href="@{/books/return}" class="btn btn-warning text-dark fw-semibold btn-sm shadow-sm">
                        <i class="bi bi-box-arrow-in-down-left me-1"></i> Trả sách bằng mã
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer">
    <div class="container text-center">
        <p class="mb-1"><strong>Ứng Dụng Quản Lý Mượn Sách & AOP Logging</strong> - Spring MVC & Spring Data JPA</p>
        <small class="text-muted">AOP Log: Trạng thái sách thay đổi (mượn/trả) &amp; Đếm lượt ghé thăm thư viện theo yêu cầu bài học.</small>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
