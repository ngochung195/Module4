<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Chi tiết khách hàng</title>
</head>
<body>

<header th:replace="~{layout :: header}"></header>

<main class="main-wrapper">
    <div class="card" style="max-width: 650px; margin: 0 auto;">
        <div class="card-header">
            <div>
                <h1 class="card-title">Chi tiết khách hàng</h1>
                <p class="card-subtitle" th:text="'Thông tin hồ sơ #' + ${customer.id}">Thông tin hồ sơ #1</p>
            </div>
            <a th:href="@{/customers}" class="btn btn-secondary btn-sm">&larr; Quay lại danh sách</a>
        </div>

        <div class="detail-list" style="margin-bottom: 2rem;">
            <div class="detail-label">Mã khách hàng:</div>
            <div class="detail-value">
                <span class="badge" th:text="'#' + ${customer.id}">#1</span>
            </div>

            <div class="detail-label">Họ và tên:</div>
            <div class="detail-value" style="font-weight: 600; font-size: 1.1rem; color: #1e293b;" th:text="${customer.name}">
                Nguyễn Văn A
            </div>

            <div class="detail-label">Email:</div>
            <div class="detail-value">
                <a th:href="'mailto:' + ${customer.email}" style="color: var(--primary); text-decoration: none;" th:text="${customer.email}">
                    nguyenvana@gmail.com
                </a>
            </div>

            <div class="detail-label">Địa chỉ:</div>
            <div class="detail-value" th:text="${customer.address != null && !#strings.isEmpty(customer.address) ? customer.address : 'Chưa cập nhật'}">
                Hà Nội
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/customers/update/{id}(id=${customer.id})}" class="btn btn-warning">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Chỉnh sửa
            </a>
            <a th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-danger">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Xóa khách hàng
            </a>
            <a th:href="@{/customers}" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
