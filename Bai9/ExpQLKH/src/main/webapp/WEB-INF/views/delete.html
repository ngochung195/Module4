<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Xóa khách hàng</title>
</head>
<body>

<header th:replace="~{layout :: header}"></header>

<main class="main-wrapper">
    <div class="card" style="max-width: 650px; margin: 0 auto; border-top: 4px solid var(--danger);">
        <div class="card-header">
            <div>
                <h1 class="card-title" style="color: var(--danger);">Xác nhận xóa khách hàng</h1>
                <p class="card-subtitle">Hành động này sẽ xóa vĩnh viễn thông tin khách hàng khỏi hệ thống</p>
            </div>
            <a th:href="@{/customers}" class="btn btn-secondary btn-sm">&larr; Quay lại</a>
        </div>

        <div class="alert alert-danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span><strong>Cảnh báo:</strong> Bạn có chắc chắn muốn xóa khách hàng này? Thao tác không thể hoàn tác!</span>
        </div>

        <div class="detail-list" style="margin-bottom: 2rem;">
            <div class="detail-label">Mã khách hàng:</div>
            <div class="detail-value"><span class="badge" th:text="'#' + ${customer.id}">#1</span></div>

            <div class="detail-label">Họ và tên:</div>
            <div class="detail-value" th:text="${customer.name}">Nguyễn Văn A</div>

            <div class="detail-label">Email:</div>
            <div class="detail-value" th:text="${customer.email}">nguyenvana@gmail.com</div>

            <div class="detail-label">Địa chỉ:</div>
            <div class="detail-value" th:text="${customer.address}">Hà Nội</div>
        </div>

        <form th:action="@{/customers/delete}" method="post">
            <input type="hidden" name="id" th:value="${customer.id}">

            <div class="form-actions">
                <button type="submit" class="btn btn-danger">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    Xác nhận xóa
                </button>
                <a th:href="@{/customers}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
