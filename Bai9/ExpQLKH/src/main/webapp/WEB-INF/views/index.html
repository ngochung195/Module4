<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Danh sách khách hàng</title>
</head>
<body>

<header th:replace="~{layout :: header}"></header>

<main class="main-wrapper">
    <!-- Flash Messages -->
    <div th:if="${message}" class="alert alert-success">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span th:text="${message}">Thông báo thành công</span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${error}">Thông báo lỗi</span>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <h1 class="card-title">Quản lý khách hàng</h1>
                <p class="card-subtitle">Danh sách tất cả khách hàng trong hệ thống</p>
            </div>
            <a th:href="@{/customers/create}" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Thêm mới khách hàng
            </a>
        </div>

        <div th:if="${#lists.isEmpty(customers)}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <h3>Chưa có khách hàng nào</h3>
            <p style="margin-top: 8px;">Hãy bấm nút "Thêm mới khách hàng" để tạo bản ghi đầu tiên.</p>
        </div>

        <div th:unless="${#lists.isEmpty(customers)}" class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th style="width: 220px; text-align: center;">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customers}">
                    <td>
                        <span class="badge" th:text="'#' + ${customer.id}">#1</span>
                    </td>
                    <td>
                        <strong th:text="${customer.name}">Nguyễn Văn A</strong>
                    </td>
                    <td th:text="${customer.email}">nguyenvana@gmail.com</td>
                    <td th:text="${customer.address}">Hà Nội</td>
                    <td>
                        <div class="actions-cell" style="justify-content: center;">
                            <a th:href="@{/customers/view/{id}(id=${customer.id})}" class="btn btn-secondary btn-sm" title="Xem chi tiết">
                                Xem
                            </a>
                            <a th:href="@{/customers/update/{id}(id=${customer.id})}" class="btn btn-warning btn-sm" title="Sửa thông tin">
                                Sửa
                            </a>
                            <a th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-danger btn-sm" title="Xóa">
                                Xóa
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
