<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lỗi Dữ Liệu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8d7da;
            color: #721c24;
        }

        .error-container {
            border: 1px solid #f5c6cb;
            padding: 20px;
            border-radius: 5px;
            background: #fff;
            max-width: 500px;
            margin: auto;
        }

        h2 {
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            color: #fff;
            background-color: #0d6efd;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h2>Xảy ra lỗi dữ liệu!</h2>
        <p th:text="${errorMessage}">Dữ liệu nhập vào không hợp lệ.</p>
        <a th:href="@{/customers}" class="btn">Quay lại danh sách</a>
    </div>
</body>

</html>
