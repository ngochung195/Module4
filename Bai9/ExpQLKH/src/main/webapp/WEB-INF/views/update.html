<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Cập nhật khách hàng</title>
</head>
<body>

<header th:replace="~{layout :: header}"></header>

<main class="main-wrapper">
    <div class="card" style="max-width: 650px; margin: 0 auto;">
        <div class="card-header">
            <div>
                <h1 class="card-title">Cập nhật thông tin khách hàng</h1>
                <p class="card-subtitle" th:text="'Mã khách hàng: #' + ${customer.id}">Mã khách hàng: #1</p>
            </div>
            <a th:href="@{/customers}" class="btn btn-secondary btn-sm">&larr; Quay lại</a>
        </div>

        <form th:action="@{/customers/update}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name" class="form-label">Họ và tên <span style="color: var(--danger);">*</span></label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Địa chỉ Email <span style="color: var(--danger);">*</span></label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Địa chỉ</label>
                <input type="text" id="address" th:field="*{address}" class="form-control">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Cập nhật
                </button>
                <a th:href="@{/customers}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
