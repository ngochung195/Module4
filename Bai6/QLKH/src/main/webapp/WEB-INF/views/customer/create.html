<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới khách hàng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eaedf1;
        }
        h2 {
            color: #2c3e50;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary {
            background-color: #3498db;
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: #fff;
            flex: 1;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Thêm mới khách hàng</h2>
    </div>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post">
        <div class="form-group">
            <label for="firstName">Họ</label>
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="Nhập họ..." required />
        </div>
        <div class="form-group">
            <label for="lastName">Tên</label>
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Nhập tên..." required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Nhập email..." required />
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/customers}" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </form>
</div>
</body>
</html>
