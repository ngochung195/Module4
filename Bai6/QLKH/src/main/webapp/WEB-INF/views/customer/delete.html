<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa khách hàng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eaedf1;
        }
        h2 {
            color: #c0392b;
            font-size: 22px;
        }
        .warning-text {
            color: #e74c3c;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .detail-group {
            margin-bottom: 14px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 6px;
        }
        .detail-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 13px;
        }
        .detail-value {
            color: #2d3748;
            font-size: 15px;
            margin-top: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: #fff;
            flex: 1;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: #fff;
            flex: 1;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Xác nhận xóa khách hàng</h2>
    </div>

    <p class="warning-text">Bạn có chắc chắn muốn xóa khách hàng sau khỏi hệ thống?</p>

    <div class="detail-group">
        <div class="detail-label">ID</div>
        <div class="detail-value" th:text="${customer.id}"></div>
    </div>
    <div class="detail-group">
        <div class="detail-label">Họ</div>
        <div class="detail-value" th:text="${customer.firstName}"></div>
    </div>
    <div class="detail-group">
        <div class="detail-label">Tên</div>
        <div class="detail-value" th:text="${customer.lastName}"></div>
    </div>
    <div class="detail-group">
        <div class="detail-label">Email</div>
        <div class="detail-value" th:text="${customer.email}"></div>
    </div>

    <form th:action="@{/customers/delete}" th:object="${customer}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="btn-group">
            <button type="submit" class="btn btn-danger">Xóa luôn</button>
            <a th:href="@{/customers}" class="btn btn-secondary">Hủy bỏ</a>
        </div>
    </form>
</div>
</body>
</html>
