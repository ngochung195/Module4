<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary mb-0"><i class="bi bi-journal-text me-2"></i>Quản lý bài viết</h2>
        <a th:href="@{/blogs/create}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Thêm bài viết mới
        </a>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th style="width: 5%;">#</th>
                        <th style="width: 25%;">Tiêu đề</th>
                        <th style="width: 35%;">Tóm tắt</th>
                        <th style="width: 15%;">Ngày tạo</th>
                        <th style="width: 20%;" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="b, iter : ${blogs}">
                        <td th:text="${iter.count}">1</td>
                        <td class="fw-semibold text-truncate" style="max-width: 200px;" th:text="${b.title}">Tiêu đề</td>
                        <td class="text-muted text-truncate" style="max-width: 300px;" th:text="${b.summary}">Tóm tắt nội dung</td>
                        <td th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')} ?: ${b.createdAt}">01/01/2026</td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/blogs/{id}/view(id=${b.id})}" class="btn btn-outline-info" title="Xem chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/blogs/{id}/edit(id=${b.id})}" class="btn btn-outline-warning" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/blogs/{id}/delete(id=${b.id})}" class="btn btn-outline-danger" title="Xóa">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(blogs)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>Hiện chưa có bài viết nào!
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
