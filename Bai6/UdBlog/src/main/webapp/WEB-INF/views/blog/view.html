<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/blogs}">Danh sách</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Chi tiết</li>
                        </ol>
                    </nav>

                    <h1 class="display-6 fw-bold text-dark mt-3 mb-2" th:text="${blog.title}">Tiêu đề bài viết</h1>

                    <div class="text-muted mb-4 pb-3 border-bottom d-flex align-items-center gap-3">
                        <span><i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')} ?: ${blog.createdAt}">01/01/2026</span></span>
                        <span><i class="bi bi-hash me-1"></i>ID: <span th:text="${blog.id}">1</span></span>
                    </div>

                    <div th:if="${blog.summary}" class="alert alert-secondary fs-6 fst-italic mb-4" th:text="${blog.summary}">
                        Tóm tắt bài viết...
                    </div>

                    <div class="blog-content fs-5 lh-lg mb-5 text-break" style="white-space: pre-wrap;" th:text="${blog.content}">
                        Nội dung chi tiết bài viết...
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/blogs}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại
                        </a>
                        <div class="gap-2 d-flex">
                            <a th:href="@{/blogs/{id}/edit(id=${blog.id})}" class="btn btn-warning text-dark">
                                <i class="bi bi-pencil-square me-1"></i>Chỉnh sửa
                            </a>
                            <a th:href="@{/blogs/{id}/delete(id=${blog.id})}" class="btn btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Xóa
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
