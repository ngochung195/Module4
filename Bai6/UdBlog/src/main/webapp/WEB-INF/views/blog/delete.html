<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận xóa bài viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Xác nhận xóa bài viết</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="fs-5 text-muted mb-3">Bạn có chắc chắn muốn xóa vĩnh viễn bài viết này không?</p>
                    <div class="alert alert-light border text-start">
                        <p class="mb-1"><strong>ID:</strong> <span th:text="${blog.id}"></span></p>
                        <p class="mb-1"><strong>Tiêu đề:</strong> <span th:text="${blog.title}"></span></p>
                        <p class="mb-0"><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')} ?: ${blog.createdAt}"></span></p>
                    </div>
                    <p class="text-danger small fst-italic mb-4">Lưu ý: Hành động này không thể hoàn tác!</p>

                    <form th:action="@{/blogs/delete}" method="post">
                        <input type="hidden" name="id" th:value="${blog.id}">
                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/blogs}" class="btn btn-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Hủy bỏ
                            </a>
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash me-1"></i>Đồng ý xóa
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
