<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>Quản lý Danh mục</h3>
        <div>
            <a th:href="@{/blogs}" class="btn btn-outline-secondary">← Về trang Blog</a>
            <a th:href="@{/categories/create}" class="btn btn-primary">+ Tạo danh mục</a>
        </div>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th style="width: 10%">ID</th>
                <th>Tên danh mục</th>
                <th style="width: 25%">Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}"></td>
                <td>
                    <a th:href="@{/categories/{id}/blogs(id=${c.id})}" th:text="${c.name}" class="fw-bold"></a>
                </td>
                <td>
                    <a th:href="@{/categories/{id}/edit(id=${c.id})}" class="btn btn-sm btn-warning">Sửa</a>
                    <a th:href="@{/categories/{id}/delete(id=${c.id})}" class="btn btn-sm btn-danger">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
