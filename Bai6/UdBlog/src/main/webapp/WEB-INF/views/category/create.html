<!-- Dùng chung form cho create.html (th:action="@{/categories/save}") hoặc edit.html (th:action="@{/categories/update}") -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <div class="card col-md-6 offset-md-3">
        <div class="card-header bg-primary text-white">
            <h5>Thêm danh mục</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/categories/save}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label class="form-label">Tên danh mục:</label>
                    <input type="text" th:field="*{name}" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-success">Lưu lại</button>
                <a th:href="@{/categories}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
</body>

</html>
