<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Xóa danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <div class="card border-danger col-md-6 offset-md-3">
        <div class="card-header bg-danger text-white">
            <h5>Xác nhận xóa danh mục</h5>
        </div>
        <div class="card-body">
            <p>Bạn có chắc muốn xóa danh mục: <strong th:text="${category.name}"></strong>?</p>
            <form th:action="@{/categories/delete}" method="post">
                <input type="hidden" name="id" th:value="${category.id}" />
                <button type="submit" class="btn btn-danger">Xóa luôn</button>
                <a th:href="@{/categories}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
</body>

</html>
