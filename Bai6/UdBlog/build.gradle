plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    springVersion = '6.1.14'
    hibernateVersion = '6.5.3.Final'
}

dependencies {
    // Jakarta Servlet API 6.0 (Tomcat 10.1+)
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Spring Web MVC 6.x & Spring ORM 6.x
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-orm:${springVersion}"

    // Hibernate Core 6.x (Jakarta Persistence)
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"

    // MySQL Connector/J
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Thymeleaf 3.1+ tích hợp Spring 6
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.2.RELEASE'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

war {
    archiveFileName = 'blog-management-jpa.war'
}

task deploy(type: Copy) {
    dependsOn war
    from war.archiveFile
    into 'D:/Application/TomCat/apache-tomcat-10.1.57-windows-x64/apache-tomcat-10.1.57/webapps'
}

task runTomcat {
    dependsOn deploy
    doLast {
        exec {
            workingDir 'D:/Application/TomCat/apache-tomcat-10.1.57-windows-x64/apache-tomcat-10.1.57/bin'
            commandLine 'cmd', '/c', 'start', 'startup.bat'
        }
    }
}

task stopTomcat {
    doLast {
        exec {
            workingDir 'D:/Application/TomCat/apache-tomcat-10.1.57-windows-x64/apache-tomcat-10.1.57/bin'
            commandLine 'cmd', '/c', 'shutdown.bat'
        }
    }
}
