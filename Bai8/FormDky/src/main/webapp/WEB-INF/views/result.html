<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành công</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .icon-success {
            width: 64px;
            height: 64px;
            background: var(--success-bg);
            color: var(--success);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .info-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: left;
            border: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        .btn-back:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-success">✓</div>
    <div class="header">
        <h1>Đăng ký thành công!</h1>
        <p th:text="${message}">Thông tin người dùng đã được xác thực và lưu trữ thành công.</p>
    </div>

    <div class="info-card" th:if="${user != null}">
        <div class="info-row" th:if="${user.id != null}">
            <span class="info-label">Mã ID:</span>
            <span class="info-value" th:text="${user.id}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Họ (Last Name):</span>
            <span class="info-value" th:text="${user.lastName}">Nguyen</span>
        </div>
        <div class="info-row">
            <span class="info-label">Tên (First Name):</span>
            <span class="info-value" th:text="${user.firstName}">Van A</span>
        </div>
        <div class="info-row">
            <span class="info-label">Số điện thoại:</span>
            <span class="info-value" th:text="${user.phoneNumber}">0987654321</span>
        </div>
        <div class="info-row">
            <span class="info-label">Tuổi:</span>
            <span class="info-value" th:text="${user.age}">22</span>
        </div>
        <div class="info-row">
            <span class="info-label">Email:</span>
            <span class="info-value" th:text="${user.email}">user@example.com</span>
        </div>
    </div>

    <a th:href="@{/}" class="btn-back">Quay lại trang đăng ký</a>
</div>

</body>
</html>
