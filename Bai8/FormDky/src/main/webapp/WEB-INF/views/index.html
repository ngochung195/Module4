<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thông tin người dùng</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-col {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        input.is-invalid {
            border-color: var(--danger);
            background-color: var(--danger-bg);
        }

        .error-message {
            margin-top: 6px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .badge-req {
            color: var(--danger);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Form Đăng Ký Người Dùng</h1>
        <p>Vui lòng điền đầy đủ và chính xác thông tin bên dưới</p>
    </div>

    <form th:action="@{/validateUser}" th:object="${user}" method="post">
        <div class="form-row">
            <div class="form-col form-group">
                <label for="firstName">First name <span class="badge-req">*</span></label>
                <input type="text" id="firstName" th:field="*{firstName}"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                       placeholder="Từ 5 - 45 ký tự" />
                <div class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Lỗi First name</div>
            </div>

            <div class="form-col form-group">
                <label for="lastName">Last name <span class="badge-req">*</span></label>
                <input type="text" id="lastName" th:field="*{lastName}"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                       placeholder="Từ 5 - 45 ký tự" />
                <div class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Lỗi Last name</div>
            </div>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone number <span class="badge-req">*</span></label>
            <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                   th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                   placeholder="Ví dụ: 0912345678 (10-11 số, bắt đầu 0)" />
            <div class="error-message" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">Lỗi Số điện thoại</div>
        </div>

        <div class="form-group">
            <label for="age">Age (Tuổi) <span class="badge-req">*</span></label>
            <input type="number" id="age" th:field="*{age}"
                   th:classappend="${#fields.hasErrors('age')} ? 'is-invalid' : ''"
                   placeholder="Tối thiểu 18 tuổi" />
            <div class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Lỗi Tuổi</div>
        </div>

        <div class="form-group">
            <label for="email">Email <span class="badge-req">*</span></label>
            <input type="text" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                   placeholder="Ví dụ: user@example.com" />
            <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi Email</div>
        </div>

        <button type="submit" class="btn-submit">Đăng ký ngay</button>
    </form>
</div>

</body>
</html>
