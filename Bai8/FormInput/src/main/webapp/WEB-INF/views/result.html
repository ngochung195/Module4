<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả xác thực</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .icon-success {
            width: 56px;
            height: 56px;
            background: var(--success-bg);
            color: var(--success);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .info-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        .btn-back:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-success">✓</div>
    <div class="header">
        <h1>Xác thực Thành công!</h1>
        <p>Thông tin người dùng đã đáp ứng đầy đủ điều kiện.</p>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">Họ và tên:</span>
            <span class="info-value" th:text="${user.name}">Nguyễn Văn A</span>
        </div>
        <div class="info-row">
            <span class="info-label">Tuổi:</span>
            <span class="info-value" th:text="${user.age}">25</span>
        </div>
    </div>

    <a th:href="@{/}" class="btn-back">Quay lại form nhập</a>
</div>

</body>
</html>
