<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực thông tin người dùng</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .error-message {
            margin-top: 6px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Xác thực Người dùng</h1>
        <p>Vui lòng điền đầy đủ thông tin để kiểm tra hợp lệ</p>
    </div>

    <form th:action="@{/validateUser}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Nhập tên từ 2 đến 30 ký tự" />
            <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi tên</div>
        </div>

        <div class="form-group">
            <label for="age">Tuổi</label>
            <input type="number" id="age" th:field="*{age}" placeholder="Nhập tuổi (tối thiểu 18)" />
            <div class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Lỗi tuổi</div>
        </div>

        <button type="submit" class="btn-submit">Xác nhận</button>
    </form>
</div>

</body>
</html>
