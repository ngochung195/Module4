<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head(~{::title})">
    <title>Danh sách khách hàng</title>
</head>
<body>
<div th:replace="layout :: navbar"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Danh sách khách hàng</h1>
            <a th:href="@{/create-customer}" class="btn btn-primary">+ Thêm khách hàng mới</a>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>#ID</th>
                    <th>Họ & tên đệm</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Tỉnh thành</th>
                    <th style="text-align: center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}"></td>
                    <td th:text="${customer.firstName}"></td>
                    <td th:text="${customer.lastName}"></td>
                    <td th:text="${customer.email}"></td>
                    <td th:text="${customer.province != null ? customer.province.name : 'Chưa có'}"></td>
                    <td style="text-align: center;">
                        <div class="actions" style="justify-content: center;">
                            <a th:href="@{/edit-customer/__${customer.id}__}" class="btn btn-secondary btn-sm">Sửa</a>
                            <a th:href="@{/delete-customer/__${customer.id}__}" class="btn btn-danger btn-sm">Xóa</a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="6" style="text-align: center; color: #64748b; padding: 2rem;">
                        Chưa có khách hàng nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="layout :: footer"></div>
</body>
</html>
