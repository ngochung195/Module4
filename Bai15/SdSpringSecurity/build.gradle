plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    } else {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.springframework:spring-webmvc:6.2.6'
    implementation 'org.springframework.security:spring-security-web:6.2.6'
    implementation 'org.springframework.security:spring-security-config:6.2.6'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.1.RELEASE'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.1.RELEASE'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

war {
    archiveFileName = 'wbds-2025-spring-security.war'
}

