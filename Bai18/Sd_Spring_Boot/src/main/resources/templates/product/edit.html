<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" th:href="@{/products}">Quản Lý Sản Phẩm</a>
        <a class="btn btn-secondary btn-sm" th:href="@{/products}">← Quay lại danh sách</a>
    </div>
</nav>

<main class="container">
    <div class="card form-container">
        <div class="card-header">
            <h1 class="card-title">Cập nhật thông tin sản phẩm</h1>
        </div>

        <form th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label" for="name">Tên sản phẩm *</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm">
                <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="price">Giá sản phẩm (VNĐ) *</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0" class="form-control" placeholder="Nhập giá sản phẩm">
                <div class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="manufacturer">Nhà sản xuất *</label>
                <input type="text" id="manufacturer" th:field="*{manufacturer}" class="form-control" placeholder="Nhập tên nhà sản xuất">
                <div class="error-text" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Mô tả sản phẩm</label>
                <textarea id="description" th:field="*{description}" class="form-control" placeholder="Nhập mô tả chi tiết về sản phẩm"></textarea>
                <div class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-warning">Cập nhật</button>
                <a class="btn btn-secondary" th:href="@{/products}">Huỷ</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
