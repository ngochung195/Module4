plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    } else {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.springframework:spring-webmvc:6.2.6'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.1.RELEASE'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.1.0'
    implementation 'org.springframework:spring-aspects:6.1.6'
}

war {
    archiveFileName = 'customer-manage-aspect.war'
}

tasks.register('deployToTomcat', Copy) {
    group = 'deployment'
    description = 'Builds WAR and deploys to Tomcat webapps directory'
    dependsOn war
    from war.archiveFile
    into 'D:/Application/TomCat/apache-tomcat-10.1.57-windows-x64/apache-tomcat-10.1.57/webapps'
}
