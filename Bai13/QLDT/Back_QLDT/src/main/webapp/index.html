<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phone Management - AJAX Web Service</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        #smartphoneList th, #smartphoneList td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }
        #smartphoneList th {
            background-color: #f4f4f4;
        }
        #add-smartphone td {
            padding: 5px;
        }
        button, input[type="submit"], input[type="button"] {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<form id="add-smartphone">
    <h1 id="form-title">Form create</h1>
    <input type="hidden" id="smartphone-id">
    <table>
        <tr>
            <td><label for="producer">Producer:</label></td>
            <td><input type="text" id="producer" placeholder="producer"></td>
        </tr>
        <tr>
            <td><label for="model">Model:</label></td>
            <td><input type="text" id="model" placeholder="model"></td>
        </tr>
        <tr>
            <td><label for="price">Price:</label></td>
            <td><input type="text" id="price" placeholder="price"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" id="btn-submit" value="Add" onclick="saveSmartPhone(event)">
                <input type="button" id="btn-cancel" value="Cancel" onclick="resetForm()" style="display: none;">
            </td>
        </tr>
    </table>
</form>

<h1 id="title">List smartphone</h1>
<div id="div-btn">
    <button onclick="successHandler()" id="display">Display list smartphone</button>
    <button onclick="displayFormCreate()" id="display-create">Create new smartphone</button>
</div>
<table id="smartphoneList"></table>

<script src="index.js"></script>
</body>
</html>
